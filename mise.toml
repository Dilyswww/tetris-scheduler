[tools]
node = "24.19.0"
python = "3.12"
uv = "latest"

[env]
UV_CACHE_DIR = "{{config_root}}/.cache/uv"

[tasks.frontend]
description = "Start the React development server"
dir = "frontend"
run = "npm run dev"

[tasks.frontend-build]
description = "Create a production frontend build"
dir = "frontend"
run = "npm run build"

[tasks.backend]
description = "Start the FastAPI development server"
dir = "backend"
run = "uv run uvicorn app.main:app --reload --port 8000"

[tasks.backend-sync]
description = "Install backend dependencies from the lockfile"
dir = "backend"
run = "uv sync --frozen"

[tasks.backend-test]
description = "Run the backend test suite"
dir = "backend"
run = "uv run pytest"
