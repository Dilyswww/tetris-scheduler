[project]
name = "tetris-backend"
version = "0.1.0"
description = "FastAPI calendar API and scheduler for Tetris"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "ortools>=9.15,<10",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
